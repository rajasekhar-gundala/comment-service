name: 💡 Feature Request
description: Suggest a new feature or enhancement for MarkReply.
title: "[FEATURE]: <Short description>"
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature! 
        MarkReply is built to be a fast, lightweight, and dependency-free comment engine. Before submitting, please consider if your request aligns with this core vision.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please verify the following before submitting your request.
      options:
        - label: I have searched the [existing issues](https://github.com/yourusername/markreply/issues) and found no duplicates.
          required: true
        - label: I believe this feature aligns with the scope of a lightweight, self-hosted engine.
          required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is. (e.g., "I'm always frustrated when...")
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen and how it might be implemented.
      placeholder: I would like to see a feature that allows...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or workarounds you've currently tried.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false