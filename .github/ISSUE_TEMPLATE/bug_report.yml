name: 🐛 Bug Report
description: Report a bug or unexpected behavior in the MarkReply engine.
title: "[BUG]: <Short description>"
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        Before you submit, please search the [existing issues](https://github.com/yourusername/markreply/issues) to ensure this hasn't already been reported.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please verify the following before submitting your report.
      options:
        - label: I have searched the existing issues and found no duplicates.
          required: true
        - label: I am running the latest version of MarkReply.
          required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected the comment to be auto-approved because I used the admin email...
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened? 
      placeholder: The comment was placed into the pending moderation queue...
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps to reproduce the issue. 
      placeholder: |
        1. Deploy the engine using Docker Compose.
        2. Set ADMIN_TOKEN in the .env file.
        3. Attempt to post a comment via the frontend widget...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MarkReply Version
      description: Which version or Git commit are you using? (e.g., v1.0.0, main branch)
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: deployment_method
    attributes:
      label: Deployment Method
      description: How are you running MarkReply?
      options:
        - Docker Compose
        - Docker (Standalone)
        - Native (Cargo run)
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server Logs / Browser Console Errors
      description: Paste any relevant Rust backend logs or frontend JavaScript errors. Please use code blocks!
      render: shell
      placeholder: |
        ```text
        Paste your logs here
        ```
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (e.g., specific OS, browser, or reverse proxy like Caddy/Nginx).
    validations:
      required: false