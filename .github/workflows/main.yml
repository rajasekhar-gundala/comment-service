name: Publish Docker
on:
  workflow_run:
    workflows: ["PR Code Quality Checks"]
    types:
      - completed
    branches:
      - main

jobs:
  github-repo:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.PERSONAL_TOKEN }}

    - name: Build Docker Image locally
      run: docker build -t ghcr.io/rajasekhar-gundala/markreply:latest .
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/rajasekhar-gundala/markreply:latest'
        format: 'table'
        exit-code: '0' # Set to 1 later to block builds on CRITICAL vulns
        severity: 'CRITICAL,HIGH'

    - name: Start Container for DAST
      run: docker run -d -p 3000:3000 --name markreply-dast ghcr.io/rajasekhar-gundala/markreply:latest

    - name: Wait for Server Startup
      run: sleep 5

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:3000'
        fail_action: false 
        allow_issue_writing: false # Explicitly disables GitHub Issue creation

    - name: Push to Registry
      run: docker push ghcr.io/rajasekhar-gundala/markreply:latest

    - name: Clean up DAST Container
      if: always()
      run: docker rm -f markreply-dast