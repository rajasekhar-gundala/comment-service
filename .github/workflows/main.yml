name: Publish Docker
on:
  workflow_run:
    workflows: ["PR Code Quality Checks"]
    types:
      - completed
    branches:
      - main

jobs:
  github-repo:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.PERSONAL_TOKEN }}

    - name: Build Docker Image locally
      # We build the image but DO NOT push it yet
      run: docker build -t ghcr.io/rajasekhar-gundala/markreply:latest .

    - name: Start Container for DAST
      # Spin up the newly built image in the background
      run: docker run -d -p 3000:3000 --name markreply-dast ghcr.io/rajasekhar-gundala/markreply:latest

    - name: Wait for Server Startup
      run: sleep 5

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:3000'
        # Set to false initially so we can review the report without crashing the pipeline
        fail_action: false 

    - name: Push to Registry
      # Only runs if the ZAP scan above succeeds (or fail_action is false)
      run: docker push ghcr.io/rajasekhar-gundala/markreply:latest

    - name: Clean up DAST Container
      if: always()
      run: docker rm -f markreply-dast