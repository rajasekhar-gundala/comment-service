name: Publish Docker Release
on:
  push:
    tags:
      - 'v*' # 🌟 Triggers ONLY when a version tag (e.g., v1.0.0) is pushed

jobs:
  github-repo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.PERSONAL_TOKEN }}

    # 🌟 NEW: Extract the tag name (e.g., v1.0.0) to use in our Docker commands
    - name: Extract Git Tag
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

    # 🌟 UPDATED: Build the image and tag it with BOTH the version and "latest"
    - name: Build Docker Image locally
      run: |
        docker build \
          -t ghcr.io/rajasekhar-gundala/markreply:${{ env.RELEASE_VERSION }} \
          -t ghcr.io/rajasekhar-gundala/markreply:latest .
          
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/rajasekhar-gundala/markreply:${{ env.RELEASE_VERSION }}'
        format: 'table'
        exit-code: '0' 
        severity: 'CRITICAL,HIGH'

    - name: Start Container for DAST
      run: docker run -d -p 3000:3000 --name markreply-dast ghcr.io/rajasekhar-gundala/markreply:${{ env.RELEASE_VERSION }}

    - name: Wait for Server Startup
      run: sleep 5

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.15.0
      with:
        target: 'http://localhost:3000'
        fail_action: false 
        allow_issue_writing: false

    # 🌟 UPDATED: Push all tags to the registry
    - name: Push to Registry
      run: docker push ghcr.io/rajasekhar-gundala/markreply --all-tags

    - name: Clean up DAST Container
      if: always()
      run: docker rm -f markreply-dast